# Account profiles. Copy to credentials.yaml (gitignored) and set the env vars.
#
# Each profile is one Anthropic account, OR one workspace within an account.
# The KEY itself never lives here — only the NAME of the env var that holds it,
# so nothing secret is committed. Point an environment at a profile to pick
# which account bills and rate-limits that agent.
profiles:
  work-primary:
    api_key_env: ANTHROPIC_API_KEY_WORK        # export this in your shell
    # workspace: wrkspc_xxxxxxxx                # set if this is a workspace, not a whole account

  personal:
    api_key_env: ANTHROPIC_API_KEY_PERSONAL

  # Example: same account, a separate workspace reserved for prompt experiments
  experiments:
    api_key_env: ANTHROPIC_API_KEY_WORK
    workspace: wrkspc_experiments_id

  # Example: route through a gateway (e.g. LiteLLM) instead of the API directly
  # gateway:
  #   api_key_env: LITELLM_KEY
  #   base_url: http://localhost:4000
